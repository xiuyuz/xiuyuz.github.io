<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Design preview — XiuYu Zhang</title><link rel="stylesheet" href="./preview.css"><script type="module" src="./preview.js"></script></head>
<body>
  <header class="preview-bar">
    <a href="./" class="back-link">← <span>All designs</span></a>
    <div class="preview-identity"><span id="design-number">01 / 10</span><h1 id="design-name">Design preview</h1></div>
    <div class="device-switch" aria-label="Preview device"><button data-device="desktop" class="active" aria-pressed="true" title="Desktop preview">▱ <span>Desktop</span></button><button data-device="mobile" aria-pressed="false" title="Mobile preview">▯ <span>Mobile</span></button></div>
    <div class="preview-actions"><button id="save-design" aria-pressed="false">♡ <span>Save</span></button><a id="full-page" title="Open standalone design" target="_blank" rel="noopener">↗</a><span class="divider"></span><a id="previous" aria-label="Previous design">←</a><a id="next" aria-label="Next design">→</a></div>
  </header>
  <main class="preview-stage" id="stage"><iframe id="concept-frame" title="Academic homepage design preview"></iframe></main>
  <div class="device-note" id="device-note" hidden>390 px · Scroll inside the preview</div>
  <div class="sr-only" role="status" id="preview-status" aria-live="polite"></div>
</body>
</html>
