name: Check external links

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check current page and asset source links
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Check published content and retained asset credits, not template docs.
          # The post-build site check validates local routes and assets. Excluding
          # this site's origin here avoids racing the deployment of new files.
          args: >-
            --user-agent 'curl/7.54'
            --scheme https --scheme http
            --exclude '^https?://xiuyuz\.github\.io(/|$)'
            --max-concurrency 8
            --max-retries 2
            --verbose --no-progress
            'index.html' '_pages/publications.md' 'assets/**/SOURCES.md'
